{% extends 'base.html' %}{% block content %}<section class="page-heading"><div><span class="eyebrow">HR WORKFLOW</span><h1>HR screening</h1><p>Capture consistent screening notes before the interview stage.</p></div></section><section class="panel form-panel"><div class="form-grid"><label>Candidate<select><option>Select a candidate</option>{% for candidate in candidates %}<option>{{ candidate.name }} · {{ candidate.position }}</option>{% endfor %}</select></label><label>Decision<select><option>Move to interview</option><option>Hold</option><option>Reject</option></select></label><label class="full">Screening questions<textarea rows="6" placeholder="Record concise answers and evidence from the conversation..."></textarea></label><label>Screening score<input type="number" min="0" max="100" placeholder="0 - 100"></label><label>Availability<input placeholder="Candidate's notice period"></label><label class="full">HR notes<textarea rows="5" placeholder="Add structured notes for the hiring panel..."></textarea></label></div><div class="form-actions"><button class="button secondary">Cancel</button><button class="button primary" data-toast="Screening saved successfully."><i class="fa-solid fa-check"></i> Save screening</button></div></section>{% endblock %}
